[package]
name = "pelty-addon-provisioning-pelican"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Export the addon ABI (off when another crate reuses this one).
default = ["export"]
export = []

[dependencies]
pelty-addon-sdk = { workspace = true, features = ["provisioning"] }
pelty-provisioning = { path = "../../../crates/pelty-provisioning" }
pelty-addon-provisioning-pterodactyl = { path = "../prov-pterodactyl", default-features = false }
